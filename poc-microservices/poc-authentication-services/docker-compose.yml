version: "3.8"

services:

  mariadb:
    container_name: poc-authentication-database
    image: mariadb:10.4
    restart: always
    ports:
      - 3306:3306
    environment:
      MARIADB_DATABASE: poc_authentication_db
      MARIADB_ROOT_PASSWORD: root
      MARIADB_USER: dba_user
      MARIADB_PASSWORD: nMo9WdE(;kyOVEXY
    volumes:
      - db:/var/lib/mysql

  backend:
    container_name: poc-authentication-services
    depends_on:
      - mariadb
    restart: on-failure
    environment:
      - DATABASE_HOST=localhost
      - DATABASE_USER=dev_poc
      - DATABASE_PASSWORD=w83y4LX6OiUB
      - DATABASE_NAME=poc_authentication_db
      - DATABASE_PORT=3306
    build: .
    ports:
      - 8080:8080
    volumes:
      - .m2:/root/.m2
    stdin_open: true
    tty: true

volumes:
  db: